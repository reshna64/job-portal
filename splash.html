<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Portal Splash</title>
  <style>
    /* Splash Screen */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #4CAF50;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeInOut 2s forwards;
    }

    #splash h1 {
      color: white;
      font-size: 80px;
      font-weight: bold;
      animation: fadeIn 1s forwards;
    }

    @keyframes fadeIn {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes fadeInOut {
      0% {
        opacity: 1;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash">
    <h1>JobConnect</h1>
  </div>

  <script>
    // Redirect to job portal after 1 second
    setTimeout(function() {
      window.location.href = "index.html"; // Redirect to the job portal page
    }, 1000);
  </script>
</body>
</html>
